name: Deploy to GitHub Pages

# Trigger the workflow on pushes to the main branch
on:
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect build requirements
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "has_package_json=true" >> $GITHUB_OUTPUT
            echo "✅ package.json detected - Node.js build required"
          else
            echo "has_package_json=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No package.json found - static site deployment"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.has_package_json == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm ci

      - name: Build with Node.js
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm run build

      - name: Upload artifact (Node.js build)
        if: steps.detect.outputs.has_package_json == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Upload artifact (static site)
        if: steps.detect.outputs.has_package_json == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4