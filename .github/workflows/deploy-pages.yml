name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect build requirements
        id: detect-build
        run: |
          if [ -f "package.json" ]; then
            echo "has-package-json=true" >> $GITHUB_OUTPUT
            echo "📦 Found package.json - Node.js project detected"
          else
            echo "has-package-json=false" >> $GITHUB_OUTPUT
            echo "📁 No package.json found - static site detected"
          fi

      - name: Setup Node.js
        if: steps.detect-build.outputs.has-package-json == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.detect-build.outputs.has-package-json == 'true'
        run: npm ci

      - name: Build project
        if: steps.detect-build.outputs.has-package-json == 'true'
        run: |
          echo "🏗️ Building the project..."
          npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (Built project)
        if: steps.detect-build.outputs.has-package-json == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Upload artifact (Static site)
        if: steps.detect-build.outputs.has-package-json == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4